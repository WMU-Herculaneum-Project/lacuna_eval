[project]
name = "lacuna-eval"
version = "0.1.0"
description = "Code for lacuna evaluation"
authors = [
  { name = "Will Fitzgerald", email = "willf@users.noreply.github.com" },
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = ["scikit-learn>=1.5.1,<2.0.0"]

[dependency-groups]
dev = [
  "black>=24.8.0,<25.0.0",
  "coverage>=7.6.1,<8.0.0",
  "flake8>=7.1.1,<8.0.0",
  "ipython>=8.26.0,<9.0.0",
  "isort>=5.13.2,<6.0.0",
  "pytest>=8.3.2,<9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
